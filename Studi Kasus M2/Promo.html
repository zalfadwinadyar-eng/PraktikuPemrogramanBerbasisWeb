<H2> Promo Diskon </H2>
<label>Harga Barang:</label>
<input type="number" id="harga"><br><br>

<label>Pilih Benefit:</label>
<select id="diskon">
    <option value="10">Member - 10%</option>
    <option value="15">Pelajar/Mahasiswa - 15%</option>
    <option value="20">Belanja di atas 500.000 - 20%</option>
    <option value="25">Promo Khusus - 25%</option>
</select>

<br><br>
<button onclick="hitungDiskon()">Hitung</button>

<p id="hasil"></p>

<script>
    function hitungDiskon() {
        let harga = Number(document.getElementById("harga").value);
        let diskon = Number(document.getElementById("diskon").value);

        let potongan = harga * diskon / 100;
        let total = harga - potongan;

        document.getElementById("hasil").innerHTML =
            "Harga Awal: Rp" + harga.toLocaleString("id-ID") +
            "<br>Diskon: " + diskon + "%" +
            "<br>Potongan: Rp" + potongan.toLocaleString("id-ID") +
            "<br>Total Bayar: Rp" + total.toLocaleString("id-ID");
        }
    </script>

<br><br>
    Promo berlaku selama persediaan masih tersedia.
</body>
